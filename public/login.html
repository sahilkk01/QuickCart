<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

main {
    background-color: grey;
    width: 100%;
    max-width: 460px;
    min-height: 200px;
    height: auto;
    margin: 0;
    padding: 30px 20px;
    border-radius: 10px;
}

.head {
    text-align: center;
    font-size: 30px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    margin-bottom: 20px;
    color: white;
}

input {
    display: block;
    width: 100%;
    max-width: 350px;
    height: 35px;
    margin: 0 auto 15px;
    padding: 8px;
    border: none;
    border-radius: 5px;
    background-color: rgb(191, 198, 193);
}

button {
    display: block;
    width: 150px;
    max-width: 100%;
    height: 35px;
    margin: 10px auto;
    text-align: center;
    background-color: rgb(94, 108, 108);
    color: beige;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: rgb(180, 202, 180);
}

.bi-arrow-left {
    padding: 4px;
    background-color: rgb(191, 198, 193);
    border-radius: 5px;
}

a {
    text-decoration: none;
}

/* Tablet */
@media (max-width: 768px) {
    main {
        max-width: 420px;
        padding: 25px 20px;
    }

    .head {
        font-size: 28px;
    }
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    main {
        width: 100%;
        max-width: 100%;
        padding: 25px 15px;
    }

    .head {
        font-size: 25px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        font-size: 14px;
    }

    button {
        width: 140px;
    }
}

    </style>
</head>
<body>
    <main>
          <div class="head">Login to QuickCart </div>
        <form>
                <input type="text"  id="x"  placeholder="Enter your Email or Mobile to login">
                <input type="password" id="y" placeholder="Password">
            <button type="button" onclick="userlogin()">Submit</button>
        </form>
        <a href="../index.html" class="bi bi-arrow-left">Home</a>
    </main>
     <script src="../src/script/login.js"></script>
</body>
</html>
