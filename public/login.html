<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        main{
            background-color: grey;
            width:400px;
            height:200px;
            margin: 180px 0px 0px 400px;
            padding:30px;
            border-radius: 10px;
        }
        .head{
            text-align: center;
            font-size: 30px;
            font-family: arial;
            font-weight: bold;
            margin-bottom: 20px;
            color:white;
        }
        input{
            width:350px;
            height:30px;
            margin:0px 0px 10px 40px;
            border-radius: 5px;
            background-color: rgb(191, 198, 193);
        }
        button{
            width:150px;
            height:30px;
            margin:0px 0px 10px 100px;
            text-align: center;
            background-color: rgb(94, 108, 108);
            color:beige;
        }
        button:hover{
            background-color:rgb(180, 202, 180);
        }
        .bi-arrow-left{
            padding:4px;
            background-color: rgb(191, 198, 193);
            border-radius: 5px;
        }
        a{
            text-decoration: none;
        }


        /* Responsive Login Page */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
}

main {
    width: 100%;
    max-width: 460px;
    height: auto;
    min-height: 200px;
    margin: 100px auto 0;
    padding: 30px 20px;
}

input {
    width: 100%;
    max-width: 350px;
    height: 35px;
    display: block;
    margin: 0 auto 15px;
}

button {
    width: 150px;
    height: 35px;
    display: block;
    margin: 10px auto;
    cursor: pointer;
}

.head {
    font-size: 30px;
}

/* Tablet */
@media (max-width: 768px) {
    main {
        margin-top: 80px;
        max-width: 420px;
    }
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    main {
        width: 100%;
        margin: 60px auto 0;
        padding: 25px 15px;
    }

    .head {
        font-size: 25px;
    }

    input {
        width: 100%;
        font-size: 14px;
    }

    button {
        width: 140px;
    }
}
    </style>
</head>
<body>
    <main>
          <div class="head">Login to QuickCart </div>
        <form>
                <input type="text"  id="x"  placeholder="Enter your Email or Mobile to login">
                <input type="password" id="y" placeholder="Password">
            <button type="button" onclick="userlogin()">Submit</button>
        </form>
        <a href="../index.html" class="bi bi-arrow-left">Home</a>
    </main>
     <script src="../src/script/login.js"></script>
</body>
</html>
